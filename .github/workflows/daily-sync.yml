name: Daily Sync

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight UTC
  workflow_dispatch: # Allow manual trigger

jobs:
  sync-and-translate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install deep-translator requests

      - name: Download latest GitHubDaily markdown
        run: |
          curl -s https://raw.githubusercontent.com/GitHubDaily/GitHubDaily/master/README.md > data.md
          
      - name: Run extraction script
        run: python scripts/extract_all.py # Script modifies src/data/projects.json

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/data/projects.json src/data/categories.json
          git commit -m "Auto-update projects data [skip ci]" || exit 0
          git push
